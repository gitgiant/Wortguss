<title>Wortguss</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first workbench. Preview + ask bar on top, part controls below;
   two columns from 900px (preview sticky on the left). */
:root {
  --bg: #eceeeb; --surface: #f8f9f7; --line: #d3d8d3; --ink: #1b2220; --muted: #5d6763;
  --accent: #9a5a22; --accent-ink: #fff8f0; --bed: #dfe3df; --ok: #2f7d4f; --warn: #a8461f;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121514; --surface: #1b1f1e; --line: #2e3533; --ink: #e5e9e6; --muted: #98a29e;
  --accent: #d6914f; --accent-ink: #1a0f05; --bed: #232927; --ok: #6cc08d; --warn: #ec8a5e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121514; --surface: #1b1f1e; --line: #2e3533; --ink: #e5e9e6; --muted: #98a29e;
  --accent: #d6914f; --accent-ink: #1a0f05; --bed: #232927; --ok: #6cc08d; --warn: #ec8a5e; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.brand { font: 800 22px/1 var(--display); font-stretch: 80%; letter-spacing: 0.01em; margin: 0; }
.brand span { color: var(--accent); }
.tag { color: var(--muted); font-size: 13px; }
.proj { margin-left: auto; display: flex; gap: 8px; align-items: center; min-width: 0; }
.proj select { min-width: 0; max-width: 260px; }
@media (max-width: 600px) { .proj { margin-left: 0; width: 100%; } .proj select { flex: 1; max-width: none; } }
#topPanel .card { border-color: var(--accent); }
.namerow { display: flex; gap: 8px; flex-wrap: wrap; }
.namerow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.main { display: grid; gap: 16px; }
@media (min-width: 900px) { .main { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  .left { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.left, .right { display: grid; gap: 12px; min-width: 0; }
.viewer { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--bed); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.vbadge { position: absolute; left: 10px; top: 10px; font: 500 12px var(--mono); color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 3px 7px; border-radius: 5px; }
.busy { position: absolute; inset: auto 10px 10px auto; font: 500 12px var(--mono); color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat { background: var(--surface); padding: 8px 10px; min-width: 0; }
.stat b { display: block; font: 500 15px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.stat.warn b { color: var(--warn); }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ask { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.askrow { display: flex; gap: 8px; align-items: flex-end; }
.askrow textarea { flex: 1; min-width: 0; resize: vertical; min-height: 44px; max-height: 200px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px; }
.reply { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.reply.err { color: var(--warn); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.mic[aria-pressed="true"] { background: var(--warn); color: var(--accent-ink); border-color: var(--warn); }
.exports { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font: 700 16px var(--display); font-stretch: 90%; display: flex; align-items: center; gap: 8px; }
.card h3 .id { font: 400 12px var(--mono); color: var(--muted); }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
.field input[type="number"], .field select, .field input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.field.check { display: flex; align-items: center; gap: 8px; }
.slots { display: flex; gap: 8px; padding-bottom: 14px; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 8px; min-width: 0; max-width: 100%; }
.slot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; position: relative; padding: 0; }
.slot[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }
.slot span { position: absolute; inset: auto -2px -16px; font: 500 10px var(--mono); color: var(--muted); }
.ams { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.ams label { display: grid; gap: 4px; font: 500 12px var(--mono); color: var(--muted); justify-items: center; }
.ams input[type="color"] { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--bg); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td input { width: 100%; min-width: 60px; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 4px 6px; font-family: var(--mono); }
.scroll { overflow-x: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.vers { display: grid; gap: 0; }
.ver { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ver .n { font: 500 13px var(--mono); color: var(--muted); }
.ver .note { min-width: 0; overflow-wrap: anywhere; }
.ver .when { display: block; color: var(--muted); font-size: 12px; }
.ver.cur .n { color: var(--accent); }
textarea.code { width: 100%; min-height: 320px; font: 12.5px/1.5 var(--mono); border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px; resize: vertical; }
.note-line { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.note-line a { color: var(--accent); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1 class="brand">Wort<span>guss</span></h1>
    <span class="tag">Describe a part, print it on the A1</span>
    <div class="proj">
      <select id="projectSel" aria-label="Project"></select>
      <button class="btn" id="renameBtn" type="button">Rename</button>
      <button class="btn" id="newBtn" type="button">New</button>
    </div>
  </header>
  <div id="topPanel" hidden></div>

  <div class="main">
    <section class="left" aria-label="Preview">
      <div class="viewer" id="viewer">
        <span class="vbadge" id="vbadge">A1 plate · 256 × 256 mm</span>
        <span class="busy" id="busy" hidden>building…</span>
      </div>
      <div class="stats" id="stats"></div>
      <form class="ask" id="askForm">
        <div class="askrow">
          <textarea id="askInput" rows="2" placeholder="e.g. make the walls 2 mm thicker and put the lid in red"></textarea>
          <button class="btn mic" id="micBtn" type="button" aria-pressed="false" hidden>Speak</button>
          <button class="btn primary" id="askBtn" type="submit">Send</button>
        </div>
        <div class="reply" id="reply" aria-live="polite"></div>
      </form>
      <div class="exports">
        <button class="btn primary" id="dlPrint" type="button">Download 3MF + STL</button>
        <button class="btn" id="dlSpec" type="button">Save spec</button>
        <button class="btn" id="copySpec" type="button">Copy spec</button>
      </div>
      <div class="note-line" id="hosted"></div>
      <div class="note-line" id="exportNote">One zip with the .3mf and an .stl per part. Open the 3MF in Bambu Studio, or drag the STLs in if the 3MF gives trouble.</div>
    </section>

    <section class="right" aria-label="Part settings">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="parts" aria-selected="true">Parts</button>
        <button role="tab" data-tab="colour" aria-selected="false">Colour &amp; fit</button>
        <button role="tab" data-tab="tools" aria-selected="false">Tool library</button>
        <button role="tab" data-tab="versions" aria-selected="false">Versions</button>
        <button role="tab" data-tab="spec" aria-selected="false">Spec</button>
      </div>
      <div class="panel" id="panel"></div>
    </section>
  </div>
</div>
<script>/*BUNDLE*/</script>
